[project]
name = "cclab-preproc"
version = "0.1.0"
description = "UC Davis Cognitive Control Lab neurophysiology preprocessing pipeline (SpikeGLX/CatGT -> Kilosort -> Phy -> recording metafile)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "joblib>=1.3",
    "jupyterlab>=4.0",
    "ipykernel>=6.25",
]

[project.scripts]
cclab-preproc = "cclab_preproc.cli:main"

[project.optional-dependencies]
sort = [
    "kilosort>=4.1",
    "torch>=2.6.0",
]
# The same plus the Kilosort window (PyQt). Not needed for a headless sort.
sort-gui = [
    "kilosort[gui]>=4.1",
    "torch>=2.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "nbconvert>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cclab_preproc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["notebooks: executes the notebooks on synthetic data (slower)"]

# Kilosort 4 (step 2) is optional because it pulls in PyTorch (~2.5 GB):
#   uv sync --extra sort
# On Windows and Linux, PyTorch comes from the CUDA build index so the NVIDIA GPU is used;
# on macOS it is the normal CPU/MPS build (fine for short test slices only).
[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
