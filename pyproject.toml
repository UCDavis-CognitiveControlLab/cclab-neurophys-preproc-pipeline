[project]
name = "cclab-preproc"
version = "0.1.0"
description = "UC Davis Cognitive Control Lab neurophysiology preprocessing pipeline (SpikeGLX/CatGT -> Kilosort -> Phy -> recording metafile)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "joblib>=1.3",
    "jupyterlab>=4.0",
    "ipykernel>=6.25",
]

[project.scripts]
cclab-preproc = "cclab_preproc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "nbconvert>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cclab_preproc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["notebooks: executes the notebooks on synthetic data (slower)"]
